# Without this file Dependabot opens one PR per package, which is how four arrived in a single
# evening for updates nobody would review separately. Grouping them into one weekly PR per
# ecosystem makes them reviewable; the security group stays separate so a real advisory is never
# queued behind a routine bump.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Majors arrive unsolicited otherwise. Excluding them from the routine group below only
    # controls GROUPING — Dependabot still opens an individual PR per major, which is how eslint
    # 9->10, plaid 43->46 and react-plaid-link 4->5 all landed failing CI on the same evening. A
    # major is a migration to schedule, not a bump to review.
    #
    # Worth knowing what this costs: ignore conditions apply to security updates too, so if the
    # only fix for an advisory were a major, no PR would be opened for it. The Dependabot ALERT
    # still fires either way and stays visible in the Security tab, so nothing goes unreported —
    # it just has to be actioned deliberately, which for a Plaid SDK is what you want anyway.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      # Anything with an advisory behind it, on its own, so it can be merged on its own.
      security:
        applies-to: security-updates
        patterns: ['*']
      # Everything else in one PR. Majors excluded: this repo runs Next 16, where a major is a
      # migration with its own guide (see AGENTS.md), not a version bump.
      routine:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
